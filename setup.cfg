[flake8]
max-line-length = 88
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    env,
    .env,
    migrations,
    */migrations/*,
    constructor/settings.py
extend-ignore = E203, W503
per-file-ignores =
    */admin.py: F401
    */models.py: F401
    */tests.py: F401
    constructor/settings.py: F401, E501