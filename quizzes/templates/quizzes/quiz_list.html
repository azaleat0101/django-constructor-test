{% extends "base.html" %}

{% block title %}Тесты — Конструктор тестов{% endblock %}

{% block content %}
<h1>Тесты</h1>

<form method="get" class="row g-2 mb-3">
    <div class="col-md-4">
        <input type="text" name="q" class="form-control"
               placeholder="Поиск по названию"
               value="{{ query }}">
    </div>
    <div class="col-md-3">
        <input type="number" name="min_q" class="form-control"
               placeholder="Мин. вопросов" min="0"
               value="{{ min_questions }}">
    </div>
    <div class="col-md-3">
        <select name="sort" class="form-select">
            <option value="title" {% if sort == "title" %}selected{% endif %}>
                Название ↑
            </option>
            <option value="-title" {% if sort == "-title" %}selected{% endif %}>
                Название ↓
            </option>
            <option value="-questions" {% if sort == "-questions" %}selected{% endif %}>
                Вопросов ↓
            </option>
            <option value="questions" {% if sort == "questions" %}selected{% endif %}>
                Вопросов ↑
            </option>
        </select>
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Применить</button>
    </div>
</form>

<p class="text-muted">Найдено тестов: {{ tests|length }}</p>

<div class="row">
    {% for test in tests %}
        {% include "quizzes/includes/quiz_card.html" %}
    {% empty %}
        <p class="text-muted">Тестов не найдено.</p>
    {% endfor %}
</div>
{% endblock %}
